<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tadashi Terai のアプリ</title>
<meta name="description" content="Tadashi Terai が開発した iPhone アプリの一覧です。">
<style>
:root{color-scheme:light dark;--bg:#f6f7fb;--fg:#1d1f2b;--sub:#5b6075;--card:#fff;--line:#e3e5ee;--link:#2f6fe4}
@media (prefers-color-scheme:dark){:root{--bg:#0e1020;--fg:#eef0fa;--sub:#a3a8c3;--card:#181b30;--line:#2a2e4a;--link:#7fb0ff}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 40px}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;display:flex;gap:14px;align-items:center}
.card img{width:56px;height:56px;border-radius:13px;flex:none}
.card b{display:block;font-size:16px}.card span{color:var(--sub);font-size:13px}
a{color:var(--link)}
</style>
</head>
<body>
<main>
  <h1>Tadashi Terai のアプリ</h1>
  <div class="card">
    <img src="https://teraitadashi.github.io/fullscreen-viewer/basket5on5/icon.png" alt="">
    <div><b>5on5バスケ ドリームカップ</b><span>選ぶだけで遊べる作戦バスケ</span><br>
    <a href="https://teraitadashi.github.io/fullscreen-viewer/basket5on5/">サポート</a> ・ <a href="https://teraitadashi.github.io/fullscreen-viewer/basket5on5/privacy.html">プライバシーポリシー</a></div>
  </div>
</main>
</body>
</html>
